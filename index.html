<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>莘逼晨成Book</title>
<style>
  :root{
    --bg-0:#06070b;
    --panel:#111623;
    --line:rgba(255,255,255,.08);
    --gold:#d9a441;
    --text:#c9d1e0;
    --dim:#6f7889;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    overflow:hidden;
    color:var(--text);
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    -webkit-font-smoothing:antialiased;
    background:var(--bg-0);
  }

  /* ============ 屏幕通用 ============ */
  .screen{
    position:fixed; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
  }
  .screen.active{display:flex; animation:fade .5s ease both;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}

  /* ============ 标题画面（加入背景图） ============ */
  #screen-title {
    overflow: hidden;
    background: #000;
  }

  /* 背景图容器 */
  .bg-container {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  /* 背景图本体 */
  .bg-image {
    position: absolute;
    left: 0;
    height: 100%;
    max-width: none; /* 防止被压缩 */
    min-width: 100%;
    object-fit: cover;
    will-change: transform;
    pointer-events: none;
  }

  /* 径向渐变遮罩，让背景变暗，突出中间的文字 */
  .bg-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: radial-gradient(circle at center, rgba(6, 7, 11, 0.45) 0%, rgba(6, 7, 11, 0.85) 100%);
    pointer-events: none;
  }

  /* 标题内容层（叠在背景之上） */
  .title-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .title-wrap{text-align:center; margin-bottom:40px;}
  .subtitle{
    margin:0 0 20px; min-height:1em;
    font-size:11px; letter-spacing:.5em; text-indent:.5em;
    color:var(--dim);
  }
  .game-title{
    margin:0;
    font-size:clamp(26px, 7.5vw, 50px);
    font-weight:400;
    letter-spacing:.12em; text-indent:.12em;
    color:#e8dcc0;
    text-shadow:0 0 30px rgba(217,164,65,.35);
    animation:breathe 5s ease-in-out infinite;
    word-break:keep-all;
  }
  @keyframes breathe{
    50%{text-shadow:0 0 48px rgba(217,164,65,.62);}
  }
  .tagline{
    margin:18px 0 0; min-height:1em;
    font-size:13px; letter-spacing:.4em; text-indent:.4em;
    color:var(--dim);
  }

  .menu{
    display:flex; flex-direction:column; gap:12px;
    width:min(320px, 84vw);
  }
  .menu-btn{
    position:relative;
    width:100%;
    padding:15px 20px;
    background:rgba(6,7,11,.6); /* 加深按钮底色，防止和背景文字混在一起 */
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text);
    font:inherit;
    font-size:16px;
    letter-spacing:.18em; text-indent:.18em;
    cursor:pointer;
    backdrop-filter: blur(4px);
    transition:background .22s, border-color .22s, color .22s, transform .22s;
  }
  .menu-btn::before{
    content:"";
    position:absolute; left:0; top:50%;
    width:2px; height:0;
    background:var(--gold);
    transform:translateY(-50%);
    transition:height .26s ease;
  }
  .menu-btn:hover{
    background:rgba(217,164,65,.15);
    border-color:rgba(217,164,65,.45);
    color:#f2e8d2;
    transform:translateX(3px);
  }
  .menu-btn:hover::before{height:60%;}
  .menu-btn:active{transform:translateX(1px) scale(.995);}

  .foot{
    position:absolute; bottom:22px; left:0; right:0;
    text-align:center;
    font-size:11px; letter-spacing:.22em;
    color:rgba(111,120,137,.6);
    z-index: 2;
  }

  /* ============ 游戏画面（占位） ============ */
  #screen-game{justify-content:flex-start; padding:0;}
  .game-wrap{
    width:100%; max-width:720px; height:100%;
    padding:20px 22px;
    display:flex; flex-direction:column; gap:22px;
  }
  .game-head{
    display:flex; justify-content:space-between; align-items:center;
    gap:12px; padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .chapter{font-size:13px; letter-spacing:.22em; color:var(--gold); opacity:.8;}
  .game-body{
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; text-align:center;
  }
  .placeholder{font-size:16px; letter-spacing:.08em; margin:0;}
  .placeholder.dim{font-size:13px; color:var(--dim);}

  /* ============ 通用按钮 ============ */
  .ghost-btn{
    padding:8px 14px;
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--dim);
    font:inherit; font-size:13px; letter-spacing:.1em;
    cursor:pointer; transition:.2s;
  }
  .ghost-btn:hover{
    color:var(--gold);
    border-color:rgba(217,164,65,.45);
    background:rgba(217,164,65,.06);
  }
  .primary-btn{
    width:100%; padding:13px; border-radius:8px;
    border:1px solid rgba(217,164,65,.45);
    background:rgba(217,164,65,.12);
    color:#f0e2c4;
    font:inherit; font-size:15px; letter-spacing:.14em;
    cursor:pointer; transition:.2s;
  }
  .primary-btn:hover{
    background:rgba(217,164,65,.22);
    border-color:var(--gold);
  }
  .primary-btn:active{transform:scale(.995);}

  /* ============ 弹窗 ============ */
  .modal-layer{
    position:fixed; inset:0; z-index:50;
    display:none; align-items:center; justify-content:center;
    padding:20px;
    background:rgba(4,6,10,.78);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .modal-layer.open{display:flex; animation:fade .25s ease both;}
  .modal{
    display:none; width:100%; max-width:520px;
    max-height:84vh; overflow-y:auto;
    padding:24px; border-radius:14px;
    border:1px solid rgba(217,164,65,.22);
    background:linear-gradient(180deg, #121724 0%, #0c1019 100%);
    box-shadow:0 26px 70px rgba(0,0,0,.65);
    animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .modal.active{display:block;}
  @keyframes pop{
    from{opacity:0; transform:translateY(10px) scale(.98);}
    to{opacity:1; transform:none;}
  }
  .modal::-webkit-scrollbar{width:6px;}
  .modal::-webkit-scrollbar-thumb{background:#2a3244; border-radius:3px;}

  .modal-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px;
  }
  .modal-head h2{
    margin:0; font-size:17px; font-weight:400;
    letter-spacing:.24em; text-indent:.24em; color:var(--gold);
  }
  .close-btn{
    width:30px; height:30px; display:grid; place-items:center;
    background:transparent; border:1px solid var(--line);
    border-radius:6px; color:var(--dim); font-size:13px;
    cursor:pointer; transition:.2s;
  }
  .close-btn:hover{color:#fff; border-color:rgba(255,255,255,.3);}

  .tabs{
    display:flex; gap:6px; margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    padding:9px 14px; background:transparent; border:none;
    border-bottom:2px solid transparent; color:var(--dim);
    font:inherit; font-size:14px; letter-spacing:.1em;
    cursor:pointer; transition:.2s;
  }
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--gold); border-bottom-color:var(--gold);}
  .tab-panel{display:none; flex-direction:column; gap:12px;}
  .tab-panel.active{display:flex;}

  .hint{
    margin:0; font-size:12.5px; line-height:1.8;
    color:var(--dim); letter-spacing:.05em;
  }
  .err{
    margin:0; min-height:16px; font-size:12.5px;
    color:#d9736b; letter-spacing:.05em;
  }
  textarea{
    width:100%; padding:12px; border-radius:8px;
    border:1px solid var(--line); background:rgba(0,0,0,.36);
    color:var(--text); font-family:ui-monospace, Menlo, Consolas, monospace;
    font-size:12.5px; line-height:1.7; resize:vertical; outline:none;
    transition:border-color .2s; word-break:break-all;
  }
  textarea:focus{border-color:rgba(217,164,65,.5);}
  textarea::placeholder{color:rgba(111,120,137,.7);}

  /* CG 画廊 */
  .cg-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
  .cg-item{
    position:relative; aspect-ratio:16/10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:5px;
    border-radius:8px; border:1px solid var(--line);
    background:rgba(255,255,255,.02); font-size:11px;
    letter-spacing:.1em; color:var(--dim); overflow:hidden; transition:.25s;
  }
  .cg-item .lock{font-size:15px; opacity:.5;}
  .cg-item.locked:hover{border-color:rgba(255,255,255,.16);}
  .cg-item.unlocked{
    background:linear-gradient(135deg, #1c2740 0%, #0e1524 100%);
    border-color:rgba(217,164,65,.3); color:#e0d5ba; cursor:pointer;
  }
  .cg-item.unlocked:hover{border-color:var(--gold); transform:translateY(-2px);}
  .cg-empty{grid-column:1/-1; padding:26px 0; text-align:center;}

  @media (max-width:480px){
    .cg-grid{grid-template-columns:repeat(2, 1fr);}
    .game-title{letter-spacing:.06em; text-indent:.06em;}
  }

  /* 告别画面 */
  .farewell{
    position:fixed; inset:0; z-index:100;
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    gap:16px; text-align:center; background:#04050a;
  }
  .farewell.show{display:flex; animation:fade 1s ease both;}
  .farewell p{margin:0; letter-spacing:.3em; text-indent:.3em;}
  .farewell p.main{font-size:18px; color:#e8dcc0;}
  .farewell p.sub{font-size:12.5px; color:var(--dim);}
</style>
</head>
<body>

<!-- ==================== 标题画面 ==================== -->
<main id="screen-title" class="screen active">
  
  <!-- 背景图容器 -->
  <div class="bg-container">
    <!-- 请确保你的图片命名为 bg.jpg 并且放在同级目录 -->
    <img src="bg.jpg" id="title-bg" class="bg-image" alt="背景图">
  </div>
  <!-- 渐变遮罩层 -->
  <div class="bg-overlay"></div>

  <!-- 内容层 -->
  <div class="title-content">
    <div class="title-wrap">
      <p class="subtitle"></p>
      <h1 class="game-title">莘逼晨成Book</h1>
      <p class="tagline"></p>
    </div>

    <nav class="menu">
      <button class="menu-btn" data-action="start">开始游戏</button>
      <button class="menu-btn" data-action="save">读取存档</button>
      <button class="menu-btn" data-action="cg">游戏 CG</button>
      <button class="menu-btn" data-action="quit">退出游戏</button>
    </nav>
  </div>

  <footer class="foot">v0.1</footer>
</main>

<!-- ==================== 游戏画面（占位） ==================== -->
<section id="screen-game" class="screen">
  <div class="game-wrap">
    <header class="game-head">
      <button class="ghost-btn" id="btn-back">← 返回标题</button>
      <span class="chapter">序 章</span>
      <button class="ghost-btn" id="btn-save-game">存档</button>
    </header>
    <div class="game-body">
      <p class="placeholder">剧情引擎施工中……</p>
      <p class="placeholder dim" id="game-status">下一步将接入文字显示与选项分支。</p>
    </div>
  </div>
</section>

<!-- ==================== 弹窗层 ==================== -->
<div id="modal-layer" class="modal-layer">
  <div class="modal" id="modal-save">
    <div class="modal-head">
      <h2>存 档</h2>
      <button class="close-btn" data-close>✕</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="tab-load">读取存档</button>
      <button class="tab" data-tab="tab-gen">生成存档码</button>
    </div>
    <div class="tab-panel active" id="tab-load">
      <p class="hint">粘贴存档码，即可回到对应的剧情节点。</p>
      <textarea id="save-input" rows="4" placeholder="在此粘贴存档码…"></textarea>
      <p class="err" id="save-err"></p>
      <button class="primary-btn" id="btn-load">载 入 存 档</button>
    </div>
    <div class="tab-panel" id="tab-gen">
      <p class="hint" id="gen-hint">当前没有游戏进度。</p>
      <textarea id="save-out" rows="4" readonly placeholder="暂无存档码"></textarea>
      <button class="primary-btn" id="btn-copy">复 制 存 档 码</button>
    </div>
  </div>

  <div class="modal" id="modal-cg">
    <div class="modal-head">
      <h2>游 戏 C G</h2>
      <button class="close-btn" data-close>✕</button>
    </div>
    <p class="hint" style="margin-bottom:14px;">随着剧情推进，会逐步解锁新的画面。</p>
    <div class="cg-grid" id="cg-grid"></div>
  </div>

  <div class="modal" id="modal-quit">
    <div class="modal-head">
      <h2>退 出 游 戏</h2>
      <button class="close-btn" data-close>✕</button>
    </div>
    <p class="hint" style="margin-bottom:20px;">确定要退出吗？<br>未保存的进度将会丢失。</p>
    <div style="display:flex; gap:10px;">
      <button class="ghost-btn" style="flex:1; padding:13px;" data-close>继续游戏</button>
      <button class="primary-btn" id="btn-confirm-quit" style="flex:1;">确认退出</button>
    </div>
  </div>
</div>

<!-- ==================== 告别画面 ==================== -->
<div class="farewell" id="farewell">
  <p class="main">再 见</p>
  <p class="sub">感 谢 游 玩</p>
  <button class="ghost-btn" id="btn-farewell-back" style="margin-top:14px;">返回标题</button>
</div>

<script>
/* =========================================================
   0. 内容配置区
   ========================================================= */
const CG_LIST = [];
function newProgress(){ return { v: 1, scene: "start" }; }


/* =========================================================
   1. 背景图正弦平移逻辑
   ========================================================= */
const bgImage = document.getElementById('title-bg');
let imgWidth = 0;
let viewportWidth = 0;
let maxOffset = 0;

// 计算图片和视口的宽度
function calculateBg() {
  if (!bgImage.complete) return;
  viewportWidth = window.innerWidth;
  
  // 强制图片高度撑满屏幕，宽度按比例自适应
  bgImage.style.height = window.innerHeight + 'px';
  bgImage.style.width = 'auto';
  
  imgWidth = bgImage.getBoundingClientRect().width;
  
  // 如果图片比屏幕宽，计算最大平移距离
  maxOffset = Math.max(0, imgWidth - viewportWidth);
}

// 监听图片加载完成（防止一开始图片没加载出来算错宽度）
if (bgImage.complete) {
  calculateBg();
} else {
  bgImage.addEventListener('load', calculateBg);
}
window.addEventListener('resize', calculateBg);

// 正弦移动动画
let startTime = null;
function animateBg(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;
  
  // 周期设为 24秒 (24000ms)，意味着每24秒完成一次左右往返
  const period = 24000; 
  const angle = (elapsed / period) * Math.PI * 2;
  
  // Math.sin 的结果在 -1 到 1 之间
  // 我们把它映射到 0 到 -maxOffset 之间
  // 当 sin 为 -1 时，位置是 0（靠左）
  // 当 sin 为 1 时，位置是 -maxOffset（靠右）
  const offset = - (Math.sin(angle) + 1) / 2 * maxOffset;
  
  bgImage.style.transform = `translateX(${offset}px)`;
  
  requestAnimationFrame(animateBg);
}
// 启动动画
requestAnimationFrame(animateBg);


/* =========================================================
   以下为之前的 UI 逻辑（原封不动）
   ========================================================= */
const $  = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

const screens = { title: $("#screen-title"), game:  $("#screen-game") };
const modalLayer = $("#modal-layer");
const saveInput  = $("#save-input");
const saveOut    = $("#save-out");
const saveErr    = $("#save-err");
const genHint    = $("#gen-hint");
const gameStatus = $("#game-status");

function encodeSave(obj){
  const json = JSON.stringify(obj);
  const utf8 = unescape(encodeURIComponent(json));
  return btoa(utf8).replace(/=+$/, "");
}
function decodeSave(code){
  const cleaned = String(code).trim().replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/");
  const padded = cleaned + "=".repeat((4 - cleaned.length % 4) % 4);
  const utf8 = atob(padded);
  const json = decodeURIComponent(escape(utf8));
  return JSON.parse(json);
}

let progress = null;

function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
}
function openModal(id){
  modalLayer.classList.add("open");
  $$(".modal").forEach(m => m.classList.toggle("active", m.id === id));
}
function closeModal(){
  modalLayer.classList.remove("open");
  $$(".modal").forEach(m => m.classList.remove("active"));
}

modalLayer.addEventListener("click", e => { if (e.target === modalLayer) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
$$("[data-close]").forEach(btn => btn.addEventListener("click", closeModal));

$$(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    $$(".tab").forEach(t => t.classList.remove("active"));
    $$(".tab-panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    $("#" + tab.dataset.tab).classList.add("active");
    if (tab.dataset.tab === "tab-gen") refreshSaveCode();
  });
});

function refreshSaveCode(){
  if (!progress){ genHint.textContent = "当前没有游戏进度。"; saveOut.value = ""; return; }
  genHint.textContent = "把下面这串码保存好，下次粘贴即可回到当前进度。";
  saveOut.value = encodeSave(progress);
}

$("#btn-copy").addEventListener("click", async () => {
  if (!saveOut.value) return;
  try{
    await navigator.clipboard.writeText(saveOut.value);
    $("#btn-copy").textContent = "已 复 制 ✓";
  }catch(err){
    saveOut.select();
    document.execCommand("copy");
    $("#btn-copy").textContent = "已 复 制 ✓";
  }
  setTimeout(() => { $("#btn-copy").textContent = "复 制 存 档 码"; }, 1500);
});

$("#btn-load").addEventListener("click", () => {
  const raw = saveInput.value.trim();
  saveErr.textContent = "";
  if (!raw){ saveErr.textContent = "请先粘贴存档码。"; return; }
  let data;
  try{ data = decodeSave(raw); }catch(err){ saveErr.textContent = "存档码格式不正确。"; return; }
  if (!data || data.v !== 1 || typeof data.scene !== "string"){
    saveErr.textContent = "存档码无效，或版本不兼容。"; return;
  }
  progress = data;
  closeModal();
  enterGame("已读取存档 · 剧情节点：" + data.scene);
});

function enterGame(statusText){
  showScreen("game");
  gameStatus.textContent = statusText || "下一步将接入文字显示与选项分支。";
}

$$(".menu-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const action = btn.dataset.action;
    if (action === "start"){
      progress = newProgress();
      enterGame("新游戏 · 剧情节点：" + progress.scene);
    }
    if (action === "save"){
      saveInput.value = ""; saveErr.textContent = "";
      openModal("modal-save");
      const tab = progress ? "[data-tab='tab-gen']" : "[data-tab='tab-load']";
      $(tab).click();
    }
    if (action === "cg"){ renderCG(); openModal("modal-cg"); }
    if (action === "quit"){ openModal("modal-quit"); }
  });
});

$("#btn-back").addEventListener("click", () => { showScreen("title"); });
$("#btn-save-game").addEventListener("click", () => {
  openModal("modal-save"); $("[data-tab='tab-gen']").click();
});

function renderCG(){
  const grid = $("#cg-grid"); grid.innerHTML = "";
  if (CG_LIST.length === 0){
    const empty = document.createElement("p");
    empty.className = "hint cg-empty"; empty.textContent = "还没有任何 CG。";
    grid.appendChild(empty); return;
  }
  CG_LIST.forEach(cg => {
    const item = document.createElement("div");
    item.className = "cg-item " + (cg.unlocked ? "unlocked" : "locked");
    if (cg.unlocked){
      item.innerHTML = `<span>${cg.name}</span>`;
      if (cg.src) item.style.backgroundImage = `url(${cg.src})`;
    } else {
      item.innerHTML = `<span class="lock">🔒</span><span>？ ？ ？</span>`;
    }
    grid.appendChild(item);
  });
}

$("#btn-confirm-quit").addEventListener("click", () => {
  window.close(); closeModal(); $("#farewell").classList.add("show");
});
$("#btn-farewell-back").addEventListener("click", () => {
  $("#farewell").classList.remove("show"); showScreen("title");
});

renderCG();
</script>
</body>
</html>
