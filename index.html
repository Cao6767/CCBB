<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>莘逼晨成Book</title>
<style>
  :root{
    --bg-0:#06070b;
    --panel:#111623;
    --line:rgba(255,255,255,.08);
    --gold:#d9a441;
    --text:#c9d1e0;
    --dim:#6f7889;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    overflow:hidden;
    color:var(--text);
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    -webkit-font-smoothing:antialiased;
    background:var(--bg-0);
  }

  /* ============ 屏幕通用 ============ */
  .screen{
    position:fixed; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
  }
  .screen.active{display:flex; animation:fade .5s ease both;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}

  /* ============ 标题画面背景 ============ */
  #screen-title { overflow: hidden; background: #000; }
  .bg-container {
    position: absolute; inset: 0; z-index: 0; overflow: hidden;
  }
  .bg-image {
    position: absolute; left: 0; top: 50%;
    transform: translateY(-50%);
    will-change: transform; pointer-events: none;
  }
  .bg-overlay {
    position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(circle at center, rgba(6, 7, 11, 0.45) 0%, rgba(6, 7, 11, 0.85) 100%);
    pointer-events: none;
  }

  /* 标题内容层 */
  .title-content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; width: 100%;
  }
  .title-wrap{text-align:center; margin-bottom:40px;}
  .subtitle{margin:0 0 20px; min-height:1em; font-size:11px; letter-spacing:.5em; text-indent:.5em; color:var(--dim);}
  .game-title{
    margin:0; font-size:clamp(26px, 7.5vw, 50px);
    font-weight:400; letter-spacing:.12em; text-indent:.12em;
    color:#e8dcc0; text-shadow:0 0 30px rgba(217,164,65,.35);
    animation:breathe 5s ease-in-out infinite; word-break:keep-all;
  }
  @keyframes breathe{50%{text-shadow:0 0 48px rgba(217,164,65,.62);}}
  .tagline{margin:18px 0 0; min-height:1em; font-size:13px; letter-spacing:.4em; text-indent:.4em; color:var(--dim);}

  .menu{display:flex; flex-direction:column; gap:12px; width:min(320px, 84vw);}
  .menu-btn{
    position:relative; width:100%; padding:15px 20px;
    background:rgba(6,7,11,.6); border:1px solid var(--line);
    border-radius:8px; color:var(--text); font:inherit;
    font-size:16px; letter-spacing:.18em; text-indent:.18em;
    cursor:pointer; backdrop-filter: blur(4px);
    transition:background .22s, border-color .22s, color .22s, transform .22s;
  }
  .menu-btn::before{
    content:""; position:absolute; left:0; top:50%;
    width:2px; height:0; background:var(--gold);
    transform:translateY(-50%); transition:height .26s ease;
  }
  .menu-btn:hover{
    background:rgba(217,164,65,.15); border-color:rgba(217,164,65,.45);
    color:#f2e8d2; transform:translateX(3px);
  }
  .menu-btn:hover::before{height:60%;}
  .menu-btn:active{transform:translateX(1px) scale(.995);}

  .foot{
    position:absolute; bottom:22px; left:0; right:0;
    text-align:center; font-size:11px; letter-spacing:.22em;
    color:rgba(111,120,137,.6); z-index: 2;
  }

  /* ============ 音乐播放器 UI ============ */
  .music-player {
    position: fixed; top: 20px; right: 20px; z-index: 100;
    display: flex; align-items: center; gap: 10px;
    padding: 6px 16px 6px 6px;
    background: rgba(6, 7, 11, 0.65); border: 1px solid var(--line);
    border-radius: 40px; backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    cursor: pointer;
  }
  .music-player:hover { border-color: rgba(217,164,65,0.4); background: rgba(6, 7, 11, 0.85); }
  .music-player.playing { border-color: rgba(217,164,65,0.5); }
  
  .music-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(217,164,65,0.15); border: 1px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: all 0.3s;
  }
  .music-player.playing .music-btn {
    animation: spin 4s linear infinite;
    background: var(--gold); color: #000;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .music-title {
    font-size: 12px; letter-spacing: 0.05em; color: var(--text);
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: sans-serif; transition: color 0.3s;
  }
  .music-player.playing .music-title { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.3); }
  
  @media (max-width: 600px) {
    .music-title { max-width: 130px; font-size: 11px; }
  }

  /* ============ 游戏画面 ============ */
  #screen-game{
    justify-content:flex-start; padding:0;
    background: url('bg1.jpeg') center/cover no-repeat;
    position: fixed; inset: 0;
    transition: filter 1.5s ease;
  }
  #screen-game::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(6, 7, 11, 0.75); z-index: 0;
    transition: background 1.5s ease;
  }

  .game-wrap{
    width:100%; max-width:720px; height:100%; 
    padding:20px 22px; display:flex; flex-direction:column; gap:22px;
    position: relative; z-index: 1;
  }
  
  .game-head{
    display:flex; justify-content:space-between; align-items:center; 
    gap:12px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  
  .game-body{
    flex:1; display:flex; flex-direction:column; 
    align-items:flex-start; justify-content:flex-start; 
    padding-top:20px; text-align:left; overflow-y: auto;
  }
  .game-body::-webkit-scrollbar{width:6px;}
  .game-body::-webkit-scrollbar-thumb{background:#2a3244; border-radius:3px;}

  #story-text {
    font-size: 16.5px; line-height: 2; letter-spacing: .05em;
    color: var(--text); white-space: pre-wrap; 
    margin-bottom: 30px; min-height: 120px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  
  #story-choices {
    display: flex; flex-direction: column; gap: 12px;
    width: 100%; margin-bottom: 20px;
  }
  .story-btn {
    width: 100%; padding: 14px 18px;
    background: rgba(255,255,255,.05); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text);
    font: inherit; font-size: 15px; text-align: left;
    cursor: pointer; transition: .2s; backdrop-filter: blur(4px);
  }
  .story-btn:hover {
    background: rgba(217,164,65,.15); border-color: rgba(217,164,65,.5);
    transform: translateX(4px); color: #fff;
  }

  /* ============ 全屏黑幕与结局弹窗 ============ */
  .screen-dark {
    position: fixed; inset: 0; z-index: 80;
    background: #000; opacity: 0; pointer-events: none;
    transition: opacity 2s ease;
  }
  .screen-dark.active { opacity: 1; pointer-events: auto; }

  .ending-modal {
    position: fixed; inset: 0; z-index: 90;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease;
    padding: 20px;
  }
  .ending-modal.active { opacity: 1; pointer-events: auto; }
  
  .ending-box {
    background: linear-gradient(180deg, #121724 0%, #0c1019 100%);
    border: 1px solid #d9736b; border-radius: 14px;
    padding: 30px 40px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    max-width: 500px; width: 100%;
  }
  .ending-box h2 { color: #d9736b; margin-top: 0; font-size: 20px; letter-spacing: 2px; }
  .ending-box p { color: var(--text); line-height: 2; margin: 15px 0; font-size: 15px;}
  .ending-box .gold-text { color: var(--gold); font-weight: bold; }

  /* ============ 通用按钮 ============ */
  .ghost-btn{padding:8px 14px; background:transparent; border:1px solid var(--line); border-radius:6px; color:var(--dim); font:inherit; font-size:13px; letter-spacing:.1em; cursor:pointer; transition:.2s;}
  .ghost-btn:hover{color:var(--gold); border-color:rgba(217,164,65,.45); background:rgba(217,164,65,.06);}
  .primary-btn{width:100%; padding:13px; border-radius:8px; border:1px solid rgba(217,164,65,.45); background:rgba(217,164,65,.12); color:#f0e2c4; font:inherit; font-size:15px; letter-spacing:.14em; cursor:pointer; transition:.2s;}
  .primary-btn:hover{background:rgba(217,164,65,.22); border-color:var(--gold);}
  .primary-btn:active{transform:scale(.995);}

  /* ============ 弹窗与成就 ============ */
  .modal-layer{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(4,6,10,.78); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
  .modal-layer.open{display:flex; animation:fade .25s ease both;}
  .modal{display:none; width:100%; max-width:520px; max-height:84vh; overflow-y:auto; padding:24px; border-radius:14px; border:1px solid rgba(217,164,65,.22); background:linear-gradient(180deg, #121724 0%, #0c1019 100%); box-shadow:0 26px 70px rgba(0,0,0,.65); animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both;}
  .modal.active{display:block;}
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;}}
  .modal::-webkit-scrollbar{width:6px;}
  .modal::-webkit-scrollbar-thumb{background:#2a3244; border-radius:3px;}

  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .modal-head h2{margin:0; font-size:17px; font-weight:400; letter-spacing:.24em; text-indent:.24em; color:var(--gold);}
  .close-btn{width:30px; height:30px; display:grid; place-items:center; background:transparent; border:1px solid var(--line); border-radius:6px; color:var(--dim); font-size:13px; cursor:pointer; transition:.2s;}
  .close-btn:hover{color:#fff; border-color:rgba(255,255,255,.3);}

  .tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--line);}
  .tab{padding:9px 14px; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--dim); font:inherit; font-size:14px; letter-spacing:.1em; cursor:pointer; transition:.2s;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--gold); border-bottom-color:var(--gold);}
  .tab-panel{display:none; flex-direction:column; gap:12px;}
  .tab-panel.active{display:flex;}

  .hint{margin:0; font-size:12.5px; line-height:1.8; color:var(--dim); letter-spacing:.05em;}
  .err{margin:0; min-height:16px; font-size:12.5px; color:#d9736b; letter-spacing:.05em;}
  textarea{width:100%; padding:12px; border-radius:8px; border:1px solid var(--line); background:rgba(0,0,0,.36); color:var(--text); font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12.5px; line-height:1.7; resize:vertical; outline:none; transition:border-color .2s; word-break:break-all;}
  textarea:focus{border-color:rgba(217,164,65,.5);}
  textarea::placeholder{color:rgba(111,120,137,.7);}

  /* 成就网格 */
  .achieve-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;}
  .achieve-item{
    position:relative; aspect-ratio:16/10; 
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px;
    border-radius:10px; border:1px solid var(--line);
    background:rgba(255,255,255,.02); font-size:12px;
    letter-spacing:.05em; color:var(--dim); overflow:hidden; transition:.25s;
  }
  .achieve-item .lock{font-size:18px; opacity:.5;}
  .achieve-item.locked:hover{border-color:rgba(255,255,255,.16);}
  
  .achieve-item.unlocked{ border-color:rgba(217,164,65,.4); cursor:default; }
  .achieve-item.unlocked .achieve-bg {
    position:absolute; inset:0; background-size:cover; background-position:center;
    opacity:0.6; transition:0.3s;
  }
  .achieve-item.unlocked:hover .achieve-bg { opacity:0.8; }
  .achieve-item.unlocked .achieve-name {
    position:relative; z-index:1; color:#fff; font-weight:bold;
    text-shadow: 0 2px 6px #000; text-align:center; padding:0 8px;
  }
  .achieve-item.unlocked::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);
  }

  /* 顶部解锁提示 Toast */
  .toast {
    position: fixed; top: 80px; left: 50%;
    transform: translate(-50%, -20px);
    background: rgba(6, 7, 11, 0.95);
    border: 1px solid var(--gold);
    color: var(--gold); padding: 12px 24px; border-radius: 30px;
    font-size: 14px; letter-spacing: .1em; font-weight: bold;
    z-index: 1000; opacity: 0; pointer-events: none;
    box-shadow: 0 10px 30px rgba(217,164,65,0.2);
    transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    display: flex; align-items: center; gap: 10px;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width:480px){
    .achieve-grid{grid-template-columns:1fr;}
    .game-title{letter-spacing:.06em; text-indent:.06em;}
  }

  .farewell{position:fixed; inset:0; z-index:100; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; background:#04050a;}
  .farewell.show{display:flex; animation:fade 1s ease both;}
  .farewell p{margin:0; letter-spacing:.3em; text-indent:.3em;}
  .farewell p.main{font-size:18px; color:#e8dcc0;}
  .farewell p.sub{font-size:12.5px; color:var(--dim);}
</style>
</head>
<body>

<!-- ==================== 音乐播放器 ==================== -->
<audio id="bgm1" src="bgm1.mp3" loop></audio>
<audio id="bgm2" src="bgm2.mp3" loop></audio>

<div id="music-player" class="music-player" title="点击播放/暂停">
  <div class="music-btn" id="music-icon">▶</div>
  <div class="music-title" id="music-title">莘逼晨晨Book</div>
</div>

<!-- ==================== 全屏黑幕与结局弹窗 ==================== -->
<div id="dark-screen" class="screen-dark"></div>
<div id="ending-modal" class="ending-modal">
  <div class="ending-box">
    <h2>💀 你晕死了过去！</h2>
    <p>解锁Bad Ending1：<span class="gold-text">您是有多福大命大？？</span></p>
    <p style="font-size:13px; color:#889;">快去成就页面看看解锁的结局吧。</p>
    <button class="primary-btn" id="btn-ending-back" style="margin-top:15px;">返回标题界面</button>
  </div>
</div>

<!-- ==================== 成就解锁提示 Toast ==================== -->
<div id="toast" class="toast">
  <span>🏆</span> <span id="toast-text">解锁成就！</span>
</div>

<!-- ==================== 标题画面 ==================== -->
<main id="screen-title" class="screen active">
  <div class="bg-container">
    <img src="bg.jpg" id="title-bg" class="bg-image" alt="背景图">
  </div>
  <div class="bg-overlay"></div>

  <div class="title-content">
    <div class="title-wrap">
      <p class="subtitle"></p>
      <h1 class="game-title">莘逼晨成Book</h1>
      <p class="tagline"></p>
    </div>
    <nav class="menu">
      <button class="menu-btn" data-action="start">开始游戏</button>
      <button class="menu-btn" data-action="save">读取存档</button>
      <button class="menu-btn" data-action="achieve">成 就</button>
      <!-- 新增：初始化按钮 -->
      <button class="menu-btn" data-action="reset" style="color: #d9736b; border-color: rgba(217,115,107,.2);">初 始 化</button>
      <button class="menu-btn" data-action="quit">退出游戏</button>
    </nav>
  </div>
  <footer class="foot">v0.1</footer>
</main>

<!-- ==================== 游戏画面 ==================== -->
<section id="screen-game" class="screen">
  <div class="game-wrap">
    <header class="game-head">
      <button class="ghost-btn" id="btn-back">← 返回标题</button>
      <button class="ghost-btn" id="btn-save-game">存档</button>
    </header>
    
    <div class="game-body">
      <div id="story-text"></div>
      <div id="story-choices"></div>
    </div>
  </div>
</section>

<!-- ==================== 弹窗层 ==================== -->
<div id="modal-layer" class="modal-layer">
  <!-- 存档弹窗 -->
  <div class="modal" id="modal-save">
    <div class="modal-head"><h2>存 档</h2><button class="close-btn" data-close>✕</button></div>
    <div class="tabs">
      <button class="tab active" data-tab="tab-load">读取存档</button>
      <button class="tab" data-tab="tab-gen">生成存档码</button>
    </div>
    <div class="tab-panel active" id="tab-load">
      <p class="hint">粘贴存档码，即可回到对应的剧情节点。</p>
      <textarea id="save-input" rows="4" placeholder="在此粘贴存档码…"></textarea>
      <p class="err" id="save-err"></p>
      <button class="primary-btn" id="btn-load">载 入 存 档</button>
    </div>
    <div class="tab-panel" id="tab-gen">
      <p class="hint" id="gen-hint">当前没有游戏进度。</p>
      <textarea id="save-out" rows="4" readonly placeholder="暂无存档码"></textarea>
      <button class="primary-btn" id="btn-copy">复 制 存 档 码</button>
    </div>
  </div>

  <!-- 成就弹窗 -->
  <div class="modal" id="modal-achieve">
    <div class="modal-head"><h2>成 就</h2><button class="close-btn" data-close>✕</button></div>
    <p class="hint" style="margin-bottom:14px;">见证你在莘莘之家的每一步足迹。</p>
    <div class="achieve-grid" id="achieve-grid"></div>
  </div>

  <!-- 初始化确认弹窗 -->
  <div class="modal" id="modal-reset">
    <div class="modal-head"><h2>初 始 化</h2><button class="close-btn" data-close>✕</button></div>
    <p class="hint" style="margin-bottom:20px; color: #d9736b;">
      警告：此操作将清空所有已解锁的成就记录，且无法撤销。确定要重置一切吗？
    </p>
    <div style="display:flex; gap:10px;">
      <button class="ghost-btn" style="flex:1; padding:13px;" data-close>取消</button>
      <button class="primary-btn" id="btn-confirm-reset" style="flex:1; border-color:#d9736b; color:#d9736b;">确认重置</button>
    </div>
  </div>

  <!-- 退出弹窗 -->
  <div class="modal" id="modal-quit">
    <div class="modal-head"><h2>退 出 游 戏</h2><button class="close-btn" data-close>✕</button></div>
    <p class="hint" style="margin-bottom:20px;">确定要退出吗？<br>未保存的进度将会丢失。</p>
    <div style="display:flex; gap:10px;">
      <button class="ghost-btn" style="flex:1; padding:13px;" data-close>继续游戏</button>
      <button class="primary-btn" id="btn-confirm-quit" style="flex:1;">确认退出</button>
    </div>
  </div>
</div>

<!-- ==================== 告别画面 ==================== -->
<div class="farewell" id="farewell">
  <p class="main">再 见</p>
  <p class="sub">感 谢 游 玩</p>
  <button class="ghost-btn" id="btn-farewell-back" style="margin-top:14px;">返回标题</button>
</div>

<script>
/* =========================================================
   1. 音乐播放控制逻辑
   ========================================================= */
const bgm1 = document.getElementById('bgm1');
const bgm2 = document.getElementById('bgm2');
const musicPlayer = document.getElementById('music-player');
const musicIcon = document.getElementById('music-icon');
const musicTitle = document.getElementById('music-title');

let activeBgm = bgm1; 

function switchMusic(newAudio, newTitle) {
  if (activeBgm !== newAudio) {
    activeBgm.pause();
    activeBgm.currentTime = 0; 
    activeBgm = newAudio;
  }
  musicTitle.textContent = newTitle;
  activeBgm.play().catch(e => console.log("需要用户交互才能播放"));
}

[bgm1, bgm2].forEach(audio => {
  audio.addEventListener('play', () => {
    musicPlayer.classList.add('playing');
    musicIcon.textContent = '💿'; 
  });
  audio.addEventListener('pause', () => {
    if (bgm1.paused && bgm2.paused) {
      musicPlayer.classList.remove('playing');
      musicIcon.textContent = '▶'; 
    }
  });
});

musicPlayer.addEventListener('click', () => {
  if (activeBgm.paused) {
    activeBgm.play().catch(e => console.log(e));
  } else {
    activeBgm.pause();
  }
});


/* =========================================================
   2. 背景图正弦平移逻辑
   ========================================================= */
const bgImage = document.getElementById('title-bg');
let imgWidth = 0;
let maxOffset = 0;

function calculateBg() {
  if (!bgImage.complete || bgImage.naturalWidth === 0) return;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  bgImage.style.height = vh + 'px';
  bgImage.style.width = 'auto';
  let currentWidth = bgImage.getBoundingClientRect().width;
  
  if (currentWidth < vw + 50) { 
    bgImage.style.width = (vw * 1.3) + 'px';
    bgImage.style.height = 'auto';
    if (bgImage.getBoundingClientRect().height < vh) {
      bgImage.style.height = vh + 'px';
      bgImage.style.width = 'auto';
    }
  }
  imgWidth = bgImage.getBoundingClientRect().width;
  maxOffset = Math.max(0, imgWidth - vw);
}

if (bgImage.complete) { calculateBg(); } else { bgImage.addEventListener('load', calculateBg); }
window.addEventListener('resize', calculateBg);

let startTime = null;
function animateBg(timestamp) {

  const elapsed = timestamp - startTime;
  const period = 60000; 
  const angle = (elapsed / period) * Math.PI * 2;
  const offset = - (Math.sin(angle) + 1) / 2 * maxOffset;
  bgImage.style.transform = `translateY(-50%) translateX(${offset}px)`;
  requestAnimationFrame(animateBg);
}

/* =========================================================
   3. 成就系统 (加入了 localStorage 永久保存)
   ========================================================= */
let ACHIEVEMENTS = [
  { id: "ach1", name: "欢迎光临莘莘之家！", unlocked: false, src: "bg.jpg" },
  { id: "ach2", name: "Bad Ending1：您是有多福大命大？？", unlocked: false, src: "bg1.jpeg" }
];

function loadAchievements() {
  const saved = localStorage.getItem("xbcb_achievements");
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      ACHIEVEMENTS.forEach(ach => {
        if (parsed.includes(ach.id)) ach.unlocked = true;
      });
    } catch(e) { console.error("成就数据解析失败"); }
  }
}

function saveAchievements() {
  const unlockedIds = ACHIEVEMENTS.filter(a => a.unlocked).map(a => a.id);
  localStorage.setItem("xbcb_achievements", JSON.stringify(unlockedIds));
}

function newProgress(){ return { v: 1, scene: "start" }; }

const $  = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

const screens = { title: $("#screen-title"), game:  $("#screen-game") };
const modalLayer = $("#modal-layer");
const saveInput  = $("#save-input");
const saveOut    = $("#save-out");
const saveErr    = $("#save-err");
const genHint    = $("#gen-hint");

const storyText = $("#story-text");
const storyChoices = $("#story-choices");

const toastEl = $("#toast");
const toastText = $("#toast-text");
let toastTimer = null;

function showToast(msg) {
  toastText.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.classList.remove('show'); }, 3000);
}

function unlockAchievement(id) {
  const ach = ACHIEVEMENTS.find(a => a.id === id);
  if (ach && !ach.unlocked) {
    ach.unlocked = true;
    saveAchievements(); 
    showToast(`解锁成就：${ach.name}`);
    if ($("#modal-achieve").classList.contains("active")) {
      renderAchievements();
    }
  }
}

function renderAchievements() {
  const grid = $("#achieve-grid"); 
  grid.innerHTML = "";
  
  ACHIEVEMENTS.forEach(ach => {
    const item = document.createElement("div");
    item.className = "achieve-item " + (ach.unlocked ? "unlocked" : "locked");
    
    if (ach.unlocked) {
      item.innerHTML = `
        <div class="achieve-bg" style="background-image: url('${ach.src}')"></div>
        <span class="achieve-name">${ach.name}</span>
      `;
    } else {
      item.innerHTML = `<span class="lock">🔒</span><span>未解锁</span>`;
    }
    grid.appendChild(item);
  });
}


/* =========================================================
   4. 存档逻辑与弹窗控制
   ========================================================= */
function encodeSave(obj){
  const json = JSON.stringify(obj);
  const utf8 = unescape(encodeURIComponent(json));
  return btoa(utf8).replace(/=+$/, "");
}
function decodeSave(code){
  const cleaned = String(code).trim().replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/");
  const padded = cleaned + "=".repeat((4 - cleaned.length % 4) % 4);
  const utf8 = atob(padded);
  const json = decodeURIComponent(escape(utf8));
  return JSON.parse(json);
}

let progress = null;

function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
}
function openModal(id){
  modalLayer.classList.add("open");
  $$(".modal").forEach(m => m.classList.toggle("active", m.id === id));
}
function closeModal(){
  modalLayer.classList.remove("open");
  $$(".modal").forEach(m => m.classList.remove("active"));
}

modalLayer.addEventListener("click", e => { if (e.target === modalLayer) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
$$("[data-close]").forEach(btn => btn.addEventListener("click", closeModal));

$$(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    $$(".tab").forEach(t => t.classList.remove("active"));
    $$(".tab-panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    $("#" + tab.dataset.tab).classList.add("active");
    if (tab.dataset.tab === "tab-gen") refreshSaveCode();
  });
});

function refreshSaveCode(){
  if (!progress){ genHint.textContent = "当前没有游戏进度。"; saveOut.value = ""; return; }
  genHint.textContent = "把下面这串码保存好，下次粘贴即可回到当前进度。";
  saveOut.value = encodeSave(progress);
}

$("#btn-copy").addEventListener("click", async () => {
  if (!saveOut.value) return;
  try{
    await navigator.clipboard.writeText(saveOut.value);
    $("#btn-copy").textContent = "已 复 制 ✓";
  }catch(err){
    saveOut.select();
    document.execCommand("copy");
    $("#btn-copy").textContent = "已 复 制 ✓";
  }
  setTimeout(() => { $("#btn-copy").textContent = "复 制 存 档 码"; }, 1500);
});

$("#btn-load").addEventListener("click", () => {
  const raw = saveInput.value.trim();
  saveErr.textContent = "";
  if (!raw){ saveErr.textContent = "请先粘贴存档码。"; return; }
  let data;
  try{ data = decodeSave(raw); }catch(err){ saveErr.textContent = "存档码格式不正确。"; return; }
  if (!data || data.v !== 1 || typeof data.scene !== "string"){
    saveErr.textContent = "存档码无效，或版本不兼容。"; return;
  }
  progress = data;
  closeModal();
  enterGame();
});


/* =========================================================
   5. 核心玩法：打字机、场景与分支
   ========================================================= */
let typingTimer = null;

function typeWriter(text, element, callback) {
  clearInterval(typingTimer);
  element.innerHTML = "";
  
  let i = 0;
  typingTimer = setInterval(() => {
    if (i < text.length) {
      if (text.charAt(i) === '\n') {
        element.innerHTML += '<br>';
      } else {
        element.innerHTML += text.charAt(i);
      }
      i++;
    } else {
      clearInterval(typingTimer);
      if (callback) callback();
    }
  }, 60); 
}

function resetGameUI() {
  clearInterval(typingTimer);
  storyText.innerHTML = "";
  storyChoices.innerHTML = "";
  document.getElementById("dark-screen").classList.remove("active");
  document.getElementById("ending-modal").classList.remove("active");
  document.getElementById("screen-game").style.filter = "none";
}

function enterGame() {
  showScreen("game");
  resetGameUI(); 

  switchMusic(bgm2, "KeraiWalk");

  const introText = "哦吼吼，逼然不美吗？你无法认识到它的美~让我给你介绍吧！\n\n末世来临，选择你的酒店。";
  
  unlockAchievement("ach1");

  typeWriter(introText, storyText, () => {
    renderChoices(); 
  });
}

function renderChoices() {
  storyChoices.innerHTML = "";
  
  const choices = [
    { text: "选项1：呆在原地不动", action: chooseStay },
    { text: "选项2：前往餐厅寻求庇护", action: chooseRestaurant },
    { text: "选项3：前往酒店安置自我", action: chooseHotel }
  ];

  choices.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "story-btn";
    btn.textContent = c.text;
    btn.onclick = () => {
      storyChoices.innerHTML = ""; 
      c.action();
    };
    storyChoices.appendChild(btn);
  });
}

function chooseStay() {
  if (Math.random() < 0.75) {
    triggerBadEnd1();
  } else {
    typeWriter("接下来该怎么做？", storyText, () => {
      renderChoices(); 
    });
  }
}

function triggerBadEnd1() {
  document.getElementById("dark-screen").classList.add("active");
  document.getElementById("screen-game").style.filter = "brightness(0)";
  
  unlockAchievement("ach2");
  
  setTimeout(() => {
    document.getElementById("ending-modal").classList.add("active");
  }, 2000); 
}

function chooseRestaurant() {
  typeWriter("你走向了餐厅寻求庇护……\n\n（餐厅剧情待开发中，敬请期待！）", storyText, () => {
    const btn = document.createElement("button");
    btn.className = "story-btn";
    btn.textContent = "重新选择";
    btn.onclick = () => {
      storyText.innerHTML = "末世来临，选择你的酒店。";
      renderChoices();
    };
    storyChoices.appendChild(btn);
  });
}

function chooseHotel() {
  typeWriter("你前往酒店安置自我……\n\n（酒店剧情待开发中，敬请期待！）", storyText, () => {
    const btn = document.createElement("button");
    btn.className = "story-btn";
    btn.textContent = "重新选择";
    btn.onclick = () => {
      storyText.innerHTML = "末世来临，选择你的酒店。";
      renderChoices();
    };
    storyChoices.appendChild(btn);
  });
}

document.getElementById("btn-ending-back").onclick = () => {
  resetGameUI();
  showScreen("title");
  switchMusic(bgm1, "莘逼晨晨Book ~ We＆炸炸炸猪");
};


/* =========================================================
   6. 菜单、重置与按钮事件绑定
   ========================================================= */
$$(".menu-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const action = btn.dataset.action;
    if (action === "start"){
      progress = newProgress();
      enterGame();
    }
    if (action === "save"){
      saveInput.value = ""; saveErr.textContent = "";
      openModal("modal-save");
      const tab = progress ? "[data-tab='tab-gen']" : "[data-tab='tab-load']";
      $(tab).click();
    }
    if (action === "achieve"){
      renderAchievements(); 
      openModal("modal-achieve");
    }
    if (action === "reset"){
      openModal("modal-reset"); // 打开重置确认弹窗
    }
    if (action === "quit"){ openModal("modal-quit"); }
  });
});

// 确认重置逻辑
$("#btn-confirm-reset").addEventListener("click", () => {
  // 1. 清空本地存储
  localStorage.removeItem("xbcb_achievements");
  
  // 2. 重置内存中的成就数据
  ACHIEVEMENTS.forEach(ach => ach.unlocked = false);
  
  // 3. 清空当前进度
  progress = null;
  
  // 4. 刷新UI
  renderAchievements();
  resetGameUI();
  
  // 5. 提示并关闭弹窗
  showToast("游戏数据已初始化");
  closeModal();
});

$("#btn-back").addEventListener("click", () => { 
  resetGameUI();
  showScreen("title");
  switchMusic(bgm1, "莘逼晨晨Book ~ We＆炸炸炸猪");
});

$("#btn-save-game").addEventListener("click", () => {
  openModal("modal-save"); $("[data-tab='tab-gen']").click();
});

$("#btn-confirm-quit").addEventListener("click", () => {
  window.close(); closeModal(); $("#farewell").classList.add("show");
});
$("#btn-farewell-back").addEventListener("click", () => {
  $("#farewell").classList.remove("show"); showScreen("title");
  switchMusic(bgm1, "莘逼晨晨Book ~ We＆炸炸炸猪");
});

musicTitle.textContent = "莘逼晨晨Book ~ We＆炸炸炸猪";
